name: UI check (emulator screenshots)

# 手動実行のみ。エミュレーターでアプリを起動し、画面のスクリーンショットを ui-check ブランチに置く
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  ui:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Build APK
        shell: bash
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease

      - name: Enable KVM
        shell: bash
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run app on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          disable-animations: true
          script: bash .github/scripts/ui-check.sh

      - name: Publish screenshots to ui-check branch
        if: always()
        shell: bash
        env:
          TOKEN: ${{ github.token }}
        run: |
          mkdir -p ui-check
          echo "run=$GITHUB_RUN_NUMBER commit=$GITHUB_SHA" > ui-check/status.txt
          cd ui-check
          git init -q -b ui-check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "UI check #$GITHUB_RUN_NUMBER"
          git push -q --force "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git" ui-check
